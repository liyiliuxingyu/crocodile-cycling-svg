<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f4f2e9" />
  <meta name="description" content="一只快乐的鳄鱼骑着单车沿河岸兜风。内嵌 SVG 动画，打开即播放。" />
  <title>鳄鱼骑行日 · Croc & Cycle</title>
  <style>
    /* 1. 页面排版：所有样式、插画与动画都保存在本文件中。 */
    :root {
      color-scheme: light;
      --paper: #f4f2e9;
      --ink: #294b39;
      --muted: #7b8270;
      --line: #dedfd1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 300px;
      min-height: 100svh;
      background: var(--paper);
      color: var(--ink);
      font-family: "Avenir Next", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    .page { max-width: 1220px; margin: 0 auto; padding: 32px 38px 24px; }
    .masthead { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 0 4px 23px; }
    .wordmark { display: flex; align-items: center; gap: 12px; font-size: 16px; font-weight: 800; letter-spacing: .13em; }
    .wordmark svg { width: 34px; height: 34px; }
    .weather { display: flex; align-items: center; gap: 10px; font-size: 12px; letter-spacing: .12em; color: var(--muted); }
    .sun-dot { width: 11px; height: 11px; border-radius: 50%; background: #e3b64d; box-shadow: 0 0 0 4px #e3b64d20; }
    .ride-panel {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      background: #fbf8ed;
      border: 1px solid #dedfd1;
      border-radius: 28px;
      box-shadow: 0 12px 40px #294b3905;
    }
    .intro { position: absolute; z-index: 1; top: 39px; left: 43px; pointer-events: none; }
    .eyebrow { margin: 0 0 15px; color: #798368; font-size: 10px; font-weight: 700; letter-spacing: .22em; }
    h1 { margin: 0; font-size: clamp(36px, 5.2vw, 62px); line-height: 1.22; font-weight: 800; letter-spacing: -.065em; }
    h1 span { color: #84945b; }
    .intro-copy { margin: 16px 0 0; font-size: 12px; letter-spacing: .12em; color: #8b8d78; }
    .scene { display: block; width: 100%; height: auto; overflow: visible; }
    .panel-caption { position: absolute; bottom: 22px; left: 32px; display: flex; align-items: center; gap: 9px; color: #7b846b; font-size: 11px; letter-spacing: .09em; }
    .caption-line { display: block; width: 24px; height: 1px; background: #a9b295; }
    .edition { position: absolute; bottom: 22px; right: 30px; font-size: 10px; color: #879079; letter-spacing: .16em; }
    .footer { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 23px 5px 4px; }
    .footer-copy { font-size: 12px; letter-spacing: .05em; color: #77836c; line-height: 1.8; }
    .footer-copy strong { color: #49613e; font-weight: 600; }
    .controls { display: flex; align-items: center; gap: 20px; flex-shrink: 0; }
    .controls[hidden] { display: none; }
    .status { display: flex; align-items: center; gap: 7px; font-size: 11px; color: #7a866e; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #809e5d; }
    .motion-button {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 41px; padding: 10px 16px; border: 1px solid #cad1bc; border-radius: 24px;
      background: transparent; color: #3f5a38; font-size: 12px; cursor: pointer;
      transition: background .18s, border-color .18s;
    }
    .motion-button:hover { background: #e8ecde; border-color: #9fad88; }
    .motion-button:focus-visible { outline: 3px solid #d6a841; outline-offset: 4px; }
    .motion-button svg { width: 13px; height: 13px; fill: currentColor; }
    .play-icon, [data-paused="true"] .pause-icon { display: none; }
    [data-paused="true"] .play-icon { display: block; }
    [data-paused="true"] .status-dot { background: #b8a779; }
    @media (min-width: 1440px) { .page { padding-top: 44px; } }
    @media (max-width: 700px) {
      .page { padding: 21px 16px 18px; }
      .masthead { padding: 0 4px 18px; }
      .wordmark { font-size: 12px; gap: 8px; }
      .wordmark svg { width: 28px; height: 28px; }
      .weather { font-size: 10px; gap: 7px; letter-spacing: 0; }
      .ride-panel { border-radius: 22px; }
      .intro { position: relative; top: auto; left: auto; padding: 28px 25px 0; }
      .eyebrow { margin-bottom: 11px; font-size: 9px; }
      h1 { font-size: clamp(33px, 7.8vw, 50px); line-height: 1.3; }
      h1 br { display: none; }
      .intro-copy { margin-top: 9px; font-size: 11px; }
      .scene { width: 119%; max-width: none; margin: -20px -9.5% 34px; }
      .panel-caption { bottom: 18px; left: 22px; font-size: 10px; }
      .edition { right: 21px; bottom: 18px; font-size: 8px; }
      .footer { padding: 19px 3px 0; flex-wrap: wrap; gap: 13px; }
      .footer-copy { font-size: 11px; }
      .controls { width: 100%; justify-content: space-between; }
    }
    @media (max-width: 420px) {
      .masthead { gap: 12px; }
      .wordmark { letter-spacing: .08em; }
      .weather { font-size: 9px; }
      .edition { display: none; }
    }
  </style>
</head>

  <main class="page">
    <header class="masthead">
      <div class="wordmark">
        <svg viewBox="0 0 38 38" aria-hidden="true">
          <circle cx="19" cy="19" r="16" fill="none" stroke="currentColor" stroke-width="1.5" />
          <path d="M10 23 Q8 14 15 13 Q15 9 19 13 L27 15 Q31 15 29 20 L19 20 L17 24 Z" fill="currentColor" />

      <div class="weather"><span class="sun-dot"></span><span>河岸 · 晴 · 有微风</span></div>

    <section class="ride-panel" aria-labelledby="page-title">

          <svg class="play-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2L14 8L4 14Z" /></svg>

  <script>
    // 9. 可选交互仅负责暂停/继续；所有运动均由上方 SVG 声明式动画驱动。
    // 即使禁用 JavaScript，骑行动画仍能播放。本文件不请求任何外部资源。
    (() => {
      const scene = document.getElementById('ride-scene');
      const controls = document.getElementById('controls');
      const button = document.getElementById('motion-toggle');
      const label = document.getElementById('motion-label');
      const status = document.getElementById('ride-status');
      const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');

      function setPaused(paused) {
        if (paused) scene.pauseAnimations();
        else scene.unpauseAnimations();
        controls.dataset.paused = String(paused);
        button.setAttribute('aria-pressed', String(paused));
        button.setAttribute('aria-label', paused ? '继续动画' : '暂停动画');
        label.textContent = paused ? '继续骑行' : '暂停动画';
        status.textContent = paused ? '稍作休息' : '正在兜风';
      }

      button.addEventListener('click', () => setPaused(!scene.animationsPaused()));
      motionPreference.addEventListener('change', event => setPaused(event.matches));
      setPaused(motionPreference.matches);
      controls.hidden = false;
    })();
  </script>
